# Kubernetes 部署配置 - ranbo-play Vue 3 + Vite SPA 应用
# 
# 使用方法：
#   kubectl apply -f k8s-deployment.yaml
#   kubectl get pods -l app=ranbo-play
#   kubectl port-forward svc/ranbo-play-service 8080:80
#
# 清理：
#   kubectl delete -f k8s-deployment.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: ranbo-play

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranbo-play
  namespace: ranbo-play
  labels:
    app: ranbo-play
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ranbo-play
  template:
    metadata:
      labels:
        app: ranbo-play
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ranbo-play
              topologyKey: kubernetes.io/hostname
      
      containers:
      - name: ranbo-play
        image: ghcr.io/ranbo12138/ranbo-play:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        
        # 环境变量
        env:
        - name: TZ
          value: UTC
        
        # 资源限制
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # 存活探针（liveness probe）
        # 容器无响应时重启
        livenessProbe:
          httpGet:
            path: /health
            port: 80
            httpHeaders:
            - name: User-Agent
              value: Kubernetes-Health-Check
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # 就绪探针（readiness probe）
        # 容器无法处理流量时从负载均衡器移除
        readinessProbe:
          httpGet:
            path: /health
            port: 80
            httpHeaders:
            - name: User-Agent
              value: Kubernetes-Health-Check
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        
        # 启动探针（startup probe）
        # 给容器足够的时间启动
        startupProbe:
          httpGet:
            path: /health
            port: 80
          failureThreshold: 30
          periodSeconds: 1
        
        # 挂载卷（可选）
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
        
        # 安全上下文
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        
        # 生命周期钩子
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5 && nginx -s quit; while killall -0 nginx 2>/dev/null; do sleep 1; done"]
      
      # 初始化容器（可选）
      initContainers: []
      
      # 卷定义（可选）
      volumes:
      - name: nginx-config
        configMap:
          name: ranbo-play-nginx-config
          defaultMode: 0644
      
      # 节点选择器（可选）
      nodeSelector:
        kubernetes.io/os: linux
      
      # 容忍度（可选）
      tolerations: []
      
      # DNS 配置
      dnsPolicy: ClusterFirst
      
      # 重启策略
      restartPolicy: Always

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranbo-play-nginx-config
  namespace: ranbo-play
data:
  nginx.conf: |
    # Nginx 配置文件 - 用于部署 ranbo-play Vue 3 + Vite SPA 应用
    # 支持前端路由、静态资源缓存、Gzip 压缩和安全头

    server {
        # 监听 80 端口
        listen 80;
        server_name _;
        
        # 设置网站根目录 - 与 Dockerfile 中的 COPY 路径一致
        root /usr/share/nginx/html;
        index index.html;
        
        # 启用 Gzip 压缩以减少传输大小
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        # 安全响应头 - 防止 XSS 点击劫持等攻击
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # 静态资源缓存 - 长期缓存以提高性能
        # 包括 JS、CSS、图片、字体等不会经常变化的文件
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }
        
        # HTML 文件不缓存 - 确保应用更新能立即生效
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
        
        # SPA 路由支持 - 关键配置！
        # 对于所有不存在的文件路径，都返回 index.html
        # 这样前端路由（Vue Router）就能接管路由处理
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # 健康检查端点 - 用于负载均衡器和监控系统
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # 错误页面配置
        # 404 错误重定向到 index.html（SPA 处理）
        error_page 404 /index.html;
        # 5xx 错误显示自定义错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: ranbo-play-service
  namespace: ranbo-play
  labels:
    app: ranbo-play
spec:
  type: LoadBalancer
  selector:
    app: ranbo-play
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ranbo-play-hpa
  namespace: ranbo-play
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ranbo-play
  
  minReplicas: 2
  maxReplicas: 10
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ranbo-play-pdb
  namespace: ranbo-play
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ranbo-play

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ranbo-play-network-policy
  namespace: ranbo-play
spec:
  podSelector:
    matchLabels:
      app: ranbo-play
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
