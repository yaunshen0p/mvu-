# 生产环境 Nginx 配置 - ranbo-play Vue 3 + Vite SPA 应用
# 
# 特点：
# - HTTPS/SSL 支持
# - HTTP 自动重定向到 HTTPS
# - 完整的安全头配置
# - CDN 友好的缓存策略
# - 完整的日志记录
# - 速率限制支持（可选）
#
# 使用方法：
#   1. 修改 server_name 为你的域名
#   2. 配置 SSL 证书路径
#   3. 复制到容器或挂载到 /etc/nginx/conf.d/

# 速率限制区域定义（可选）
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;

server {
    # 监听 HTTP（用于重定向到 HTTPS）
    listen 80;
    listen [::]:80;
    
    server_name example.com www.example.com;
    
    # 请求日志（可选）
    access_log /var/log/nginx/ranbo-play-http.log combined;
    error_log /var/log/nginx/ranbo-play-error.log warn;
    
    # HTTP 到 HTTPS 永久重定向
    location / {
        return 301 https://$server_name$request_uri;
    }
    
    # Let's Encrypt 验证路径（保留用于证书续期）
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/;
    }
}

server {
    # 监听 HTTPS
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name example.com www.example.com;
    
    # 请求日志
    access_log /var/log/nginx/ranbo-play-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/ranbo-play-error.log warn;
    
    # ==========================================
    # SSL/TLS 配置
    # ==========================================
    
    # SSL 证书和密钥
    ssl_certificate /etc/nginx/ssl/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/example.com/privkey.pem;
    
    # SSL 会话配置
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    
    # SSL 协议版本（仅支持 TLS 1.2 及以上）
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # 密码套件
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    
    # OCSP Stapling（提高连接性能和隐私）
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/live/example.com/chain.pem;
    
    # HSTS（HTTP Strict Transport Security）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # ==========================================
    # 静态文件服务
    # ==========================================
    
    # 网站根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # ==========================================
    # Gzip 压缩
    # ==========================================
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-js
        text/x-component
        text/x-cross-domain-policy
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/ld+json
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";
    
    # ==========================================
    # 安全响应头
    # ==========================================
    
    # 防止浏览器 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS 防护
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy（前身为 Feature Policy）
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # 内容安全策略（CSP）- 按需调整
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.openai.com; frame-ancestors 'self';" always;
    
    # 防止缓存过期内容
    add_header Pragma "no-cache" always;
    
    # ==========================================
    # 缓存策略
    # ==========================================
    
    # 静态资源长期缓存（1年）
    # 文件名包含哈希值，内容变化时文件名也会变化
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }
    
    # 其他静态资源（但不包括上面明确指定的）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept-Encoding" always;
    }
    
    # HTML 文件：不缓存（或缓存时间很短）
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Vary "Accept-Encoding" always;
    }
    
    # ==========================================
    # SPA 路由支持
    # ==========================================
    
    location / {
        # 尝试按以下顺序查找文件：
        # 1. 精确匹配 URI 对应的文件
        # 2. 精确匹配 URI 对应的目录（加 /）
        # 3. 如果都不存在，返回 index.html 让前端路由处理
        try_files $uri $uri/ /index.html;
        
        # 关闭对 index.html 的缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    
    # ==========================================
    # 健康检查端点
    # ==========================================
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain" always;
    }
    
    # ==========================================
    # 性能监控端点（可选）
    # ==========================================
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    
    # ==========================================
    # 拒绝隐藏文件和目录
    # ==========================================
    
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ==========================================
    # 错误页面配置
    # ==========================================
    
    # 404 错误返回 index.html（SPA 处理）
    error_page 404 /index.html;
    
    # 5xx 错误自定义页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # ==========================================
    # 性能和安全优化
    # ==========================================
    
    # 启用 TCP 管道
    tcp_nopush on;
    tcp_nodelay on;
    
    # 连接超时
    keepalive_timeout 65;
    
    # 客户端超时
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # 限制请求体大小
    client_max_body_size 10m;
    
    # 隐藏 Nginx 版本号
    server_tokens off;
}

# ==========================================
# HTTP/2 推送（可选，用于性能优化）
# ==========================================
# 注意：某些浏览器可能不支持 HTTP/2 推送，考虑使用 <link rel="preload"> 替代

